name: Build & Deploy to Plesk (staging-store.vneconomics.com)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build SPA + PHP API & Sync to Plesk
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci

      - name: 4. Static typecheck, unit tests & PHP syntax check
        run: |
          npm run typecheck
          npm test
          for f in api/*.php; do php -l "$f"; done

      - name: 5. Build Vite SPA
        run: npm run build

      - name: 6. Assemble Plesk Payload (SPA + PHP API + .htaccess)
        run: |
          mkdir -p dist/api
          cp -r api/*.php dist/api/ 2>/dev/null || true
          rm -f dist/api/config.php
          cp public/.htaccess dist/.htaccess 2>/dev/null || true
          echo "staging-store.vneconomics.com build completed at $(date -u) (${GITHUB_SHA::7})" > dist/build-info.txt

      - name: 7. Deploy to Plesk via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.PLESK_FTP_SERVER }}
          username: ${{ secrets.PLESK_FTP_USERNAME }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php

      - name: 8. Sync 'release-staging' & 'release-production' Branches
        run: |
          cd dist
          git init -b release-staging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: sync testing platform build to Plesk (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" release-staging:release-staging release-staging:release-production
